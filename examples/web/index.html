<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>labelbridge web example</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main>
      <h1>labelbridge — ブラウザから印刷するサンプル</h1>
      <p class="note">
        Chromium 系ブラウザ（デスクトップ版）で動きます。USB は WebUSB、Bluetooth（SPP）は Web Serial を使います。
        画像は拡大縮小せず、1 画素 = 1 ドットで印字します。
      </p>

      <section>
        <h2>1. プリンター</h2>
        <div class="row">
          <button id="connect-usb" type="button">USB で接続</button>
          <button id="connect-serial" type="button">シリアル（Bluetooth SPP）で接続</button>
          <button id="refresh" type="button" disabled>状態を読み直す</button>
        </div>
        <div class="row note">
          プリンターなしでプレビューだけ見る:
          <select id="manual-model">
            <option value="">（接続したプリンターの値を使う）</option>
          </select>
          <select id="manual-tape" disabled></select>
        </div>
        <dl id="printer-info" class="info">
          <dt>機種</dt><dd id="info-model">—</dd>
          <dt>状態</dt><dd id="info-status">—</dd>
          <dt>テープ幅</dt><dd id="info-tape">—</dd>
          <dt>印字可能ドット数</dt><dd id="info-dots">—</dd>
          <dt>解像度</dt><dd id="info-dpi">—</dd>
        </dl>
      </section>

      <section>
        <h2>2. ラベル</h2>
        <div class="row">
          <label><input type="radio" name="source" value="text" checked /> テキスト</label>
          <label><input type="radio" name="source" value="image" /> 画像ファイル</label>
        </div>
        <div id="source-text" class="row">
          <input id="text" type="text" value="Hello, label!" size="30" />
          <label>文字サイズ（ドット） <input id="font-px" type="number" value="48" min="8" max="400" /></label>
          <label>左右の余白（ドット） <input id="pad" type="number" value="16" min="0" max="400" /></label>
        </div>
        <div id="source-image" class="row" hidden>
          <input id="file" type="file" accept="image/png,image/bmp,image/gif,image/webp" />
          <span class="note">高さが印字可能ドット数を超える画像はエラーになります（縮小しません）</span>
        </div>
        <div class="row">
          <label>二値化のしきい値 <input id="threshold" type="range" min="1" max="254" value="128" /> <span id="threshold-value">128</span></label>
        </div>
        <p class="note">プレビュー（3 倍に拡大。1 マス = 1 ドット）</p>
        <div class="preview"><img id="preview" alt="" /></div>
        <p id="preview-size" class="note">—</p>
      </section>

      <section>
        <h2>3. 印刷</h2>
        <div class="row">
          <label>枚数 <input id="copies" type="number" value="1" min="1" max="20" /></label>
          <label>濃度 <input id="density" type="number" value="0" min="-5" max="5" /></label>
          <label>カット <select id="cut"></select></label>
          <label>前後の余白（ドット） <input id="margin" type="number" value="0" min="0" max="500" /></label>
          <button id="print" type="button" disabled>印刷</button>
        </div>
        <pre id="log" class="log"></pre>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
