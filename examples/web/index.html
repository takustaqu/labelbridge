<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>labelbridge demo</title>
    <meta name="description" content="Print labels dot by dot from the browser over WebUSB or Web Serial with labelbridge." />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main>
      <header class="top">
        <h1 data-i18n="title">labelbridge — print labels from the browser</h1>
        <nav class="lang" aria-label="Language">
          <button type="button" data-lang="en">English</button>
          <button type="button" data-lang="ja">日本語</button>
        </nav>
      </header>
      <p class="note" data-i18n="intro"></p>
      <p class="note">
        <a href="https://github.com/takustaqu/labelbridge">GitHub</a> ·
        <a href="https://www.npmjs.com/package/@takustaqu/labelbridge">npm</a>
      </p>

      <section>
        <h2 data-i18n="printer"></h2>
        <div class="row">
          <button id="connect-usb" type="button" data-i18n="connectUsb"></button>
          <button id="connect-serial" type="button" data-i18n="connectSerial"></button>
          <button id="refresh" type="button" disabled data-i18n="refresh"></button>
        </div>
        <div class="row note">
          <span data-i18n="manual"></span>
          <select id="manual-model">
            <option value="" data-i18n="manualNone"></option>
          </select>
          <select id="manual-tape" disabled></select>
        </div>
        <dl id="printer-info" class="info">
          <dt data-i18n="model"></dt><dd id="info-model">—</dd>
          <dt data-i18n="status"></dt><dd id="info-status">—</dd>
          <dt data-i18n="tape"></dt><dd id="info-tape">—</dd>
          <dt data-i18n="dots"></dt><dd id="info-dots">—</dd>
          <dt data-i18n="dpi"></dt><dd id="info-dpi">—</dd>
        </dl>
      </section>

      <section>
        <h2 data-i18n="label"></h2>
        <div class="row">
          <label><input type="radio" name="source" value="text" checked /> <span data-i18n="text"></span></label>
          <label><input type="radio" name="source" value="image" /> <span data-i18n="imageFile"></span></label>
        </div>
        <div id="source-text" class="row">
          <input id="text" type="text" value="Hello, label!" size="30" />
          <label><span data-i18n="fontPx"></span> <input id="font-px" type="number" value="48" min="8" max="400" /></label>
          <label><span data-i18n="pad"></span> <input id="pad" type="number" value="16" min="0" max="400" /></label>
        </div>
        <div id="source-image" class="row" hidden>
          <input id="file" type="file" accept="image/png,image/bmp,image/gif,image/webp" />
          <span class="note" data-i18n="imageNote"></span>
        </div>
        <div class="row">
          <label><span data-i18n="threshold"></span> <input id="threshold" type="range" min="1" max="254" value="128" /> <span id="threshold-value">128</span></label>
        </div>
        <p class="note" data-i18n="previewNote"></p>
        <div class="preview"><img id="preview" alt="" /></div>
        <p id="preview-size" class="note">—</p>
      </section>

      <section>
        <h2 data-i18n="print"></h2>
        <div class="row">
          <label><span data-i18n="copies"></span> <input id="copies" type="number" value="1" min="1" max="20" /></label>
          <label><span data-i18n="density"></span> <input id="density" type="number" value="0" min="-5" max="5" /></label>
          <label><span data-i18n="cut"></span> <select id="cut"></select></label>
          <label><span data-i18n="margin"></span> <input id="margin" type="number" value="0" min="0" max="500" /></label>
          <button id="print" type="button" disabled data-i18n="printButton"></button>
        </div>
        <p class="note" data-i18n="libNote"></p>
        <pre id="log" class="log"></pre>
      </section>

      <footer class="note">
        Unofficial; not affiliated with KING JIM CO., LTD. "TEPRA" is a registered trademark of KING JIM CO., LTD.
      </footer>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
