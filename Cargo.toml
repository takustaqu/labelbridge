[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/takustaqu/labelbridge"
rust-version = "1.85"

[workspace.dependencies]
labelbridge = { path = "crates/labelbridge" }
labelbridge-transport = { path = "crates/labelbridge-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# wasm（packages/labelbridge が埋め込む）: cargo build -p labelbridge-wasm --profile wasm --target wasm32-unknown-unknown
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
